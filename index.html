        // Hàm tải dữ liệu từ Supabase
        async function loadPlaces() {
            try {
                const { data, error } = await supabaseClient

                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;
                places = data || [];
                // Đồng bộ dự phòng sang localStorage
                localStorage.setItem('places', JSON.stringify(places));
            } catch (err) {
                console.error("Lỗi khi tải dữ liệu từ Supabase (Chuyển sang dùng bộ nhớ cục bộ):", err);
                places = JSON.parse(localStorage.getItem('places')) || defaultPlaces;
            }
            updateFilters();
            renderPlaces();

        // Tính khoảng cách (Haversine formula) - km
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
            return (R * c).toFixed(1);
        }

        // Trích xuất lat/lng từ link map hoặc tọa độ thủ công
        function extractLatLng(input) {
            if (!input || input.trim() === '') return null;
            const text = input.trim();
            // Định dạng: 10.7725,106.7042
            const coordRegex = /^([-+]?\d+\.\d+),\s*([-+]?\d+\.\d+)$/;
            const coordMatch = text.match(coordRegex);
            if (coordMatch) {
                return { lat: parseFloat(coordMatch[1]), lng: parseFloat(coordMatch[2]) };
            }
            // Định dạng link chứa @10.7725,106.7042
            const urlRegex = /@([-+]?\d+\.\d+),([-+]?\d+\.\d+)/;
            const urlMatch = text.match(urlRegex);
            if (urlMatch) {
                return { lat: parseFloat(urlMatch[1]), lng: parseFloat(urlMatch[2]) };
            }
            return null;
        }

        // Lấy tọa độ GPS thiết bị hiện tại của người dùng
        function getCurrentCoordinates(mode) {
            const statusElement = mode === 'add' ? document.getElementById('geoStatusAdd') : document.getElementById('geoStatusEdit');
            const inputElement = mode === 'add' ? document.getElementById('inputMapLink') : document.getElementById('editMapLink');
            
            statusElement.innerText = "Đang lấy vị trí GPS hiện tại...";
            statusElement.classList.remove('hidden');

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lng = position.coords.longitude.toFixed(6);
                        inputElement.value = `${lat},${lng}`;
                        statusElement.innerText = `Đã lấy tọa độ thành công: ${lat}, ${lng}`;
                    },
                    (error) => {
                        statusElement.innerText = "Không thể lấy vị trí. Vui lòng cấp quyền hoặc nhập tay.";
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                statusElement.innerText = "Trình duyệt không hỗ trợ định vị.";
            }
        }

        // Lấy vị trí người dùng để tính khoảng cách
        function getUserLocation() {
            const btn = document.getElementById('btnLocation');
            const icon = document.getElementById('locationIcon');
            const text = document.getElementById('locationText');
            const errorText = document.getElementById('locationError');

            errorText.classList.add('hidden');
            icon.classList.add('fa-spin');
            text.innerText = "Đang định vị...";

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                        icon.classList.remove('fa-spin');
                        icon.classList.replace('fa-location-crosshairs', 'fa-check');
                        btn.classList.replace('bg-blue-100', 'bg-green-100');
                        btn.classList.replace('text-blue-700', 'text-green-700');
                        text.innerText = "Đã lấy vị trí (Ưu tiên gần nhất)";
                        renderPlaces(); 
                    },
                    (error) => {
                        icon.classList.remove('fa-spin');
                        text.innerText = "Tìm quán gần tôi";
                        errorText.innerText = "Không thể lấy vị trí. Vui lòng cho phép quyền truy cập vị trí trên trình duyệt.";
                        errorText.classList.remove('hidden');
                    }
                );
            } else {
                icon.classList.remove('fa-spin');
                text.innerText = "Tìm quán gần tôi";
                errorText.innerText = "Trình duyệt của bạn không hỗ trợ định vị.";

        // Cập nhật Đánh giá Sao nhanh từ màn hình chính (So sánh chuỗi an toàn)
        async function updateRating(id, newRating) {
            event.stopPropagation(); // Tránh kích hoạt các sự kiện click khác
            const oldRating = (places.find(p => String(p.id) === String(id)) || {}).rating || 5;
            places = places.map(p => String(p.id) === String(id) ? { ...p, rating: newRating } : p);
            renderPlaces();
            localStorage.setItem('places', JSON.stringify(places));

            try {
                const { error } = await supabaseClient
                    .from('places')
                    .update({ rating: newRating })
                    .eq('id', id);
                if (error) throw error;
            } catch (err) {
                console.error("Không thể lưu đánh giá mới lên Supabase:", err);
                alert("Lỗi Supabase khi cập nhật sao: " + err.message + "\n(Vui lòng kiểm tra phân quyền RLS Policies trên database)");
                // Hoàn tác lại rating cũ nếu lỗi
                places = places.map(p => String(p.id) === String(id) ? { ...p, rating: oldRating } : p);
                renderPlaces();
                localStorage.setItem('places', JSON.stringify(places));
            }
        }

        // Hàm cập nhật Option cho Filter tự động
        function updateFilters() {
            const categorySelect = document.getElementById('filterCategory');
            const districtSelect = document.getElementById('filterDistrict');

            const currentCat = categorySelect.value || 'Tất cả';
            const currentDist = districtSelect.value || 'Tất cả';

            const categories = ['Tất cả', ...new Set(places.map(p => p.category))];
            const districts = ['Tất cả', ...new Set(places.map(p => p.district))];

            categorySelect.innerHTML = categories.map(c => `<option value="${c}">${c === 'Tất cả' ? 'Mọi thể loại' : c}</option>`).join('');
            districtSelect.innerHTML = districts.map(d => `<option value="${d}">${d === 'Tất cả' ? 'Tất cả khu vực' : d}</option>`).join('');

            if (categories.includes(currentCat)) categorySelect.value = currentCat;
            if (districts.includes(currentDist)) districtSelect.value = currentDist;
        }

        // Thêm mới quán (Không truyền id thủ công lên Supabase)
        async function handleAddNewPlace(e) {
            e.preventDefault();
            
            const name = document.getElementById('inputName').value;
            const category = document.getElementById('inputCategory').value.trim();
            const district = document.getElementById('inputDistrict').value.trim();
            const address = document.getElementById('inputAddress').value;
            const mapInput = document.getElementById('inputMapLink').value.trim();
            const review = document.getElementById('inputReview').value;

            // Xử lý tọa độ và link bản đồ
            let lat = null;
            let lng = null;
            let map_link = "";

            const coords = extractLatLng(mapInput);
            if (coords) {
                lat = coords.lat;
                lng = coords.lng;
            } else if (mapInput.startsWith('http')) {
                map_link = mapInput;
            }

            const newPlace = {
                name,
                category,
                district,
                address,
                rating: 5, // Mặc định khi thêm mới là 5 sao, sửa sau ở ngoài
                review,
                lat,
                lng,
                map_link
            };

            try {
                // Thêm vào Supabase và lấy về bản ghi có chứa ID tự động sinh
                const { data, error } = await supabaseClient
                    .from('places')
                    .insert([newPlace])
                    .select();

                if (error) throw error;
                
                if (data && data.length > 0 && data[0].id) {
                    places.unshift(data[0]); // Đẩy bản ghi thực tế từ Supabase (có id chuẩn) vào danh sách
                } else {
                    newPlace.id = Date.now();
                    places.unshift(newPlace);
                }
            } catch (err) {
                console.error("Lỗi khi thêm mới lên Supabase, chuyển sang lưu tạm local:", err);
                alert("Lỗi Supabase khi thêm quán: " + err.message + "\n(Vui lòng kiểm tra RLS Policies trên Supabase dashboard)");
                newPlace.id = Date.now();
                places.unshift(newPlace);
            }

            localStorage.setItem('places', JSON.stringify(places));
            toggleModal(false);
            document.getElementById('addForm').reset();
            updateFilters();
            renderPlaces();
        }

        // Render Cards
        function renderPlaces() {
            const filterCat = document.getElementById('filterCategory').value;
            const filterDist = document.getElementById('filterDistrict').value;
            const searchQuery = document.getElementById('inputSearch').value.toLowerCase().trim();
            const grid = document.getElementById('placesGrid');

            let result = places.filter(p => {
                const matchCat = filterCat === 'Tất cả' || p.category === filterCat;
                const matchDist = filterDist === 'Tất cả' || p.district === filterDist;
                const matchSearch = p.name.toLowerCase().includes(searchQuery);
                const matchFav = !showOnlyFavorites || favoriteIds.includes(String(p.id));
                return matchCat && matchDist && matchSearch && matchFav;
            });

            if (userLocation) {
                result = result.map(p => {
                    if (p.lat && p.lng) {
                        return { ...p, distance: calculateDistance(userLocation.lat, userLocation.lng, p.lat, p.lng) };
                    }
                    return { ...p, distance: 9999 };
                });
                result.sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));
            }

            grid.innerHTML = '';

            if (result.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">
                    <i class="fa-solid fa-box-open text-4xl mb-3 opacity-50"></i>
                    <p>Không tìm thấy quán nào phù hợp với bộ lọc hiện tại.</p>
                </div>`;
                return;
            }

            // Logic Phân Trang
            const totalItems = result.length;
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);

            if (currentPage > totalPages && totalPages > 0) {
                currentPage = totalPages;
            }

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const paginatedResult = result.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            paginatedResult.forEach(place => {
                let distanceHTML = '';
                if (place.distance && place.distance < 9999) {
                    distanceHTML = `<div class="flex items-center gap-1.5 text-green-600 text-sm font-medium mt-2">
                        <!-- Icon chỉ đường làm chỉ dẫn nhỏ (hinh3.jpg) -->
                        <img src="pictures/hinh3.jpg" class="w-6 h-6 object-contain inline-block mr-0.5" style="filter: url(#remove-white);"> Cách bạn khoảng ${place.distance} km
                    </div>`;
                }

                // Cấu hình Link Google Map (Link chia sẻ hoặc Tọa độ hoặc Địa chỉ text)

                if (place.map_link && place.map_link !== '') {
                    mapUrl = place.map_link;
                } else if (place.lat && place.lng) {
                    mapUrl = `https://www.google.com/maps/search/?api=1&query=${place.lat},${place.lng}`;
                } else {
                    mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name + ' ' + place.address + ' ' + place.district)}`;
                }

                // Vẽ sao để click đánh giá trực tiếp - đổi từ sao vàng sang sao cam sữa

                const currentRating = Math.round(place.rating || 5);

                    starsHTML += `<i onclick="updateRating('${place.id}', ${i})" class="cursor-pointer text-lg p-0.5 fa-star ${isFilled ? 'fa-solid text-orange-400' : 'fa-regular text-gray-300 hover:text-orange-300'}"></i>`;
                }

                // Icon Yêu thích (Trái tim đỏ FontAwesome - So sánh chuỗi an toàn)
                const isFav = favoriteIds.includes(String(place.id));

                const card = `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col justify-between hover:shadow-md transition-all relative overflow-hidden group">
                        
                        <!-- Hàng trên cùng: Tên quán bên trái, Trái tim dịch ra góc ngoài cùng bên phải (Badge phân loại ẩn) -->

                                <img src="pictures/hinh7.jpg" class="w-6 h-6 object-contain flex-shrink-0" style="filter: url(#remove-white) saturate(1.3);" alt="Map">
                                <span class="leading-none">${place.address}, ${place.district}</span>

            // Vẽ các nút phân trang nếu có nhiều hơn 1 trang
            if (totalPages > 1) {
                let paginationHTML = `
                    <div class="col-span-full flex justify-center items-center gap-2 mt-8 mb-4">
                        <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}

                            <i class="fa-solid fa-chevron-left text-xs"></i> Trước

                for (let i = 1; i <= totalPages; i++) {

                            Sau <i class="fa-solid fa-chevron-right text-xs"></i>

                grid.innerHTML += paginationHTML;

        // Xử lý cơ chế kéo để reload (Pull-to-refresh) cho Mobile Standalone
        let touchStart = 0;
        let touchDecel = 0;
        const ptrIndicator = document.getElementById('pullToRefreshIndicator');
        const ptrText = document.getElementById('pullToRefreshText');

        window.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0) {
                touchStart = e.touches[0].clientY;
            } else {
                touchStart = 0;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (touchStart === 0) return;
            const currentY = e.touches[0].clientY;
            const distance = currentY - touchStart;

            if (distance > 0 && distance < 180) {
                ptrIndicator.style.height = `${distance}px`;
                ptrIndicator.style.paddingTop = '0.75rem';
                ptrIndicator.style.paddingBottom = '0.75rem';
                ptrIndicator.style.borderBottomWidth = '1px';
                ptrIndicator.style.opacity = `${distance / 180}`;
                if (distance > 100) {
                    ptrText.innerText = "Thả tay để làm mới dữ liệu...";
                } else {
                    ptrText.innerText = "Kéo để làm mới...";
                }
            }
        });

        window.addEventListener('touchend', async (e) => {
            if (touchStart === 0) return;
            const currentY = e.changedTouches[0].clientY;
            const distance = currentY - touchStart;

            if (distance > 100) {
                ptrText.innerText = "Đang cập nhật từ Supabase...";
                ptrIndicator.style.height = '50px';
                ptrIndicator.style.paddingTop = '0.75rem';
                ptrIndicator.style.paddingBottom = '0.75rem';
                ptrIndicator.style.borderBottomWidth = '1px';
                await loadPlaces();
            }
            
            // Đóng indicator sau khi load xong hoặc hủy kéo
            setTimeout(() => {
                ptrIndicator.style.height = '0px';
                ptrIndicator.style.paddingTop = '0px';
                ptrIndicator.style.paddingBottom = '0px';
                ptrIndicator.style.borderBottomWidth = '0px';
                ptrIndicator.style.opacity = '0';
            }, 600);
            
            touchStart = 0;
        });

        // Khởi chạy khi tải trang
        loadPlaces();

    </script>
</body>
</html>
