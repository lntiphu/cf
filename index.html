    <script>
        // Đăng ký Service Worker cho PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker đã đăng ký thành công.', reg))
                    .catch(err => console.log('Đăng ký Service Worker thất bại: ', err));
            });
        }

        // Cấu hình kết nối Supabase
        const SUPABASE_URL = "https://cqtqpejhcsjqpllhhsls.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxdHFwZWpoY3NqcXBsbGhoc2xzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MzMxOTYsImV4cCI6MjA5OTUwOTE5Nn0.gpA1BL8ccxli_l9lrWRpVjVYSysTMUDFI6wmpLwvbBk";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let places = [];
        let userLocation = null;
        let placeToDeleteId = null;
        let pendingAction = null; // Lưu hành động chờ xác thực: { type: 'delete'|'update', data: ... }
        let showOnlyFavorites = false;
        let currentPage = 1;
        const ITEMS_PER_PAGE = 6;

        // Quản lý vuốt chuyển trang trên di động ở khu vực giữa
        let swipeStartX = 0;
        let swipeCurrentX = 0;
        let isSwipingPage = false;

        function handleSwipeStart(e) {
            swipeStartX = e.touches[0].clientX;
            isSwipingPage = true;
            
            const container = document.getElementById('pageSwipeContainer');
            if (container) {
                container.classList.remove('transition-all', 'duration-150');
            }
        }

        function handleSwipeMove(e) {
            if (!isSwipingPage) return;
            swipeCurrentX = e.touches[0].clientX;
            const diffX = swipeCurrentX - swipeStartX;
            
            // Giới hạn trượt tối đa 60px để giữ thẩm mỹ
            const limitedDiff = Math.max(-60, Math.min(60, diffX));
            
            const container = document.getElementById('pageSwipeContainer');
            if (container) {
                container.style.transform = `translateX(${limitedDiff}px)`;
                container.style.opacity = (1 - Math.abs(limitedDiff) / 120).toString();
            }
        }

        function handleSwipeEnd(e) {
            if (!isSwipingPage) return;
            isSwipingPage = false;
            
            const diffX = swipeCurrentX - swipeStartX;
            const threshold = 40; // Kích hoạt chuyển trang khi vuốt quá 40px
            
            const container = document.getElementById('pageSwipeContainer');
            if (container) {
                container.classList.add('transition-all', 'duration-150');
                container.style.transform = '';
                container.style.opacity = '';
            }

            if (diffX > threshold) {
                // Vuốt sang PHẢI -> Về trang trước
                if (currentPage > 1) {
                    changePage(currentPage - 1);
                }
            } else if (diffX < -threshold) {
                // Vuốt sang TRÁI -> Sang trang sau
                const totalPages = Math.ceil(places.filter(p => {
                    const filterCat = document.getElementById('filterCategory').value;
                    const filterDist = document.getElementById('filterDistrict').value;
                    const searchQuery = document.getElementById('inputSearch').value.toLowerCase().trim();
                    const matchCat = filterCat === 'Tất cả' || p.category === filterCat;
                    const matchDist = filterDist === 'Tất cả' || p.district === filterDist;
                    const matchSearch = p.name.toLowerCase().includes(searchQuery);
                    const matchFav = !showOnlyFavorites || favoriteIds.includes(String(p.id));
                    return matchCat && matchDist && matchSearch && matchFav;
                }).length / ITEMS_PER_PAGE);

                if (currentPage < totalPages) {
                    changePage(currentPage + 1);
                }
            }
            
            swipeStartX = 0;
            swipeCurrentX = 0;
        }

        function changePage(page) {
            currentPage = page;
            renderPlaces();
            
            const grid = document.getElementById('placesGrid');
            if (grid) {
                // Tính toán tọa độ cuộn trừ đi khoảng trống Header cố định (100px) để không bị che khuất quán đầu tiên
                const elementPosition = grid.getBoundingClientRect().top + window.scrollY;
                const offsetPosition = elementPosition - 100;
                
                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            }
        }

        function handleFilterChange() {
            currentPage = 1;
            renderPlaces();
        }

        // Tính khoảng cách (Haversine formula) - km (Ép kiểu số an toàn tuyệt đối)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const p1 = parseFloat(lat1);
            const r1 = parseFloat(lon1);
            const p2 = parseFloat(lat2);
            const r2 = parseFloat(lon2);

            if (isNaN(p1) || isNaN(r1) || isNaN(p2) || isNaN(r2)) return 9999;

            const R = 6371; // Bán kính Trái Đất (km)
            const dLat = (p2 - p1) * (Math.PI / 180);
            const dLon = (r2 - r1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(p1 * (Math.PI / 180)) * Math.cos(p2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
            return (R * c).toFixed(1);
        }

        function djb2Hash(str) {
            let hash = 5381;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) + hash) + str.charCodeAt(i);
                hash = hash & 0xFFFFFFFF;
            }
            return (hash >>> 0).toString(16);
        }

        function verifySecurityCode() {
            try {
                const inputVal = document.getElementById('confirmSecurityCode').value.trim();
                
                // Băm mật khẩu người dùng nhập vào
                const hash = djb2Hash(inputVal);
                
                // Đối chiếu với mã băm đã lưu
                if (hash === "7de1d77c") {
                    executePendingAction(); // Thực thi trước để lấy pendingAction
                    closeSecurityModal();   // Đóng modal sau
                } else {
                    alert("Mã bảo mật không chính xác! Vui lòng thử lại.");
                }
            } catch (err) {
                alert("Lỗi xác thực: " + err.message);
            }
        }

        async function executePendingAction() {
            try {
                if (!pendingAction) return;
                const actionType = pendingAction.type;
                const actionData = pendingAction.data;
                
                // Xóa biến chờ trước khi thực thi
                pendingAction = null;

                if (actionType === 'delete') {
                    await proceedDelete(actionData);
                } else if (actionType === 'update') {
                    await proceedUpdate(actionData);
                }
            } catch (err) {
                alert("Lỗi thực thi hành động: " + err.message);
            }
        }

        async function proceedDelete(deleteId) {
            if (deleteId !== null) {
                const deleteTarget = String(deleteId).trim();
                
                // Chốt chặn 1: Nếu ID trống hoặc không hợp lệ, thoát ngay lập tức
                if (deleteTarget === "" || deleteTarget === "null" || deleteTarget === "undefined") {
                    return;
                }

                // Kiểm tra xem có phải ID tạm thời cục bộ tự tạo không (ID Date.now() dài 13 ký tự)
                const isTempId = deleteTarget.length > 10 || isNaN(Number(deleteTarget));
                
                if (!isTempId) {
                    const idInt = parseInt(deleteTarget);
                    
                    // Chốt chặn 2: Bảo vệ cơ sở dữ liệu. Nếu idInt là NaN hoặc không hợp lệ, chặn đứng lệnh gửi lên Supabase.
                    if (!isNaN(idInt) && idInt > 0) {
                        try {
                            const { error } = await supabaseClient
                                .from('places')
                                .delete()
                                .eq('id', idInt);
                            if (error) throw error;
                        } catch (err) {
                            console.error("Lỗi khi xóa trên Supabase:", err);
                            alert("Lỗi Supabase khi xóa quán: " + err.message);
                        }
                    } else {
                        console.warn("Chặn lệnh xóa Supabase để bảo vệ bảng do ID không hợp lệ:", idInt);
                    }
                }

                // Lọc bỏ quán ăn ở localStorage để cập nhật ngay giao diện cục bộ
                places = places.filter(p => String(p.id) !== deleteTarget);
                localStorage.setItem('places', JSON.stringify(places));

                toggleEditModal(false); // Đóng modal chỉnh sửa
                updateFilters();
                renderPlaces();
            }
        }

        // Trích xuất lat/lng từ link map hoặc tọa độ thủ công (Nhạy bén hơn với mọi kiểu copy-paste)
        function extractLatLng(input) {
            if (!input || input.trim() === '') return null;
            const text = input.trim();
            
            // 1. Tìm cặp số thực (vĩ độ, kinh độ) phân tách bằng dấu phẩy ở bất kỳ đâu trong chuỗi
            const coordRegex = /([-+]?\d+\.\d+)\s*,\s*([-+]?\d+\.\d+)/;
            const coordMatch = text.match(coordRegex);
            if (coordMatch) {
                return { lat: parseFloat(coordMatch[1]), lng: parseFloat(coordMatch[2]) };
            }
            return null;
        }

        // Lấy vị trí người dùng để tính khoảng cách (Cấu hình GPS độ chính xác cao)

            errorText.classList.add('hidden');

            text.innerText = "Đang định vị...";

            if ("geolocation" in navigator) {

                        icon.classList.remove('fa-spin');
                        icon.classList.replace('fa-location-crosshairs', 'fa-check');
                        btn.classList.replace('bg-orange-100', 'bg-green-100');

                    (error) => {

                    { 
                        enableHighAccuracy: true, // Bắt buộc bật chíp GPS thật của điện thoại để lấy vị trí chính xác nhất
                        timeout: 10000,           // Thời gian chờ tối đa 10 giây
                        maximumAge: 0             // Không sử dụng vị trí lưu trong bộ nhớ đệm cũ
                    }
                );

                icon.classList.remove('fa-spin');
                text.innerText = "Tìm quán gần tôi";

        // Thêm mới quán (Không truyền id thủ công lên Supabase)
        async function handleAddNewPlace(e) {
            e.preventDefault();
            
            const name = document.getElementById('inputName').value;
            const category = document.getElementById('inputCategory').value.trim();
            const district = document.getElementById('inputDistrict').value.trim();
            const address = document.getElementById('inputAddress').value;
            const opening_hours = document.getElementById('inputOpeningHours').value.trim();

            const review = document.getElementById('inputReview').value;

            // Xử lý tọa độ GPS

            let lng = null;
            const coords = extractLatLng(latLngInput);
            if (coords) {
                lat = coords.lat;
                lng = coords.lng;
            }

            const newPlace = {
                name,
                category,
                district,
                address,
                opening_hours: opening_hours || null,
                rating: 5, // Mặc định khi thêm mới là 5 sao, sửa sau ở ngoài
                review,
                lat,
                lng
            };

            try {
                // Thêm vào Supabase và lấy về bản ghi có chứa ID tự động sinh
                const { data, error } = await supabaseClient
                    .from('places')
                    .insert([newPlace])
                    .select();

                if (error) throw error;
                
                if (data && data.length > 0 && data[0].id) {
                    places.unshift(data[0]); // Đẩy bản ghi thực tế từ Supabase (có id chuẩn) vào danh sách
                } else {
                    newPlace.id = Date.now();
                    places.unshift(newPlace);
                }

                console.error("Lỗi khi thêm mới lên Supabase, chuyển sang lưu tạm local:", err);
                alert("Lỗi Supabase khi thêm quán: " + err.message + "\n(Vui lòng kiểm tra RLS Policies trên Supabase dashboard)");
                newPlace.id = Date.now();
                places.unshift(newPlace);
            }

            localStorage.setItem('places', JSON.stringify(places));
            toggleModal(false);
            document.getElementById('addForm').reset();
            updateFilters();
            renderPlaces();
        }

        // Thực hiện cập nhật thực tế sau khi xác thực thành công
        async function proceedUpdate(updateData) {
            if (!updateData) return;
            const { id, name, category, district, address, opening_hours, latLngInput, review } = updateData;

            // Xử lý tọa độ GPS
            let lat = null;
            let lng = null;
            const coords = extractLatLng(latLngInput);
            if (coords) {
                lat = coords.lat;
                lng = coords.lng;
            }

            const updatedData = {
                name,
                category,
                district,
                address,
                opening_hours: opening_hours || null,
                review,
                lat,
                lng
            };

            // Tìm và cập nhật local (So sánh chuỗi an toàn)
            places = places.map(p => String(p.id) === String(id) ? { ...p, ...updatedData } : p);
            localStorage.setItem('places', JSON.stringify(places));

            try {
                const { error } = await supabaseClient
                    .from('places')
                    .update(updatedData)
                    .eq('id', id);
                if (error) throw error;
            } catch (err) {
                console.error("Lỗi khi cập nhật lên Supabase:", err);
                alert("Lỗi Supabase khi cập nhật thông tin quán: " + err.message);
            }

            toggleEditModal(false); // Đóng modal chỉnh sửa
            updateFilters();
            renderPlaces();
        }

        // Render Cards
        function renderPlaces() {
            const filterCat = document.getElementById('filterCategory').value;
            const filterDist = document.getElementById('filterDistrict').value;
            const searchQuery = document.getElementById('inputSearch').value.toLowerCase().trim();
            const grid = document.getElementById('placesGrid');

            let result = places.filter(p => {
                const matchCat = filterCat === 'Tất cả' || p.category === filterCat;
                const matchDist = filterDist === 'Tất cả' || p.district === filterDist;
                const matchSearch = p.name.toLowerCase().includes(searchQuery);
                const matchFav = !showOnlyFavorites || favoriteIds.includes(String(p.id));
                return matchCat && matchDist && matchSearch && matchFav;
            });

            if (userLocation) {
                result = result.map(p => {
                    if (p.lat && p.lng) {
                        return { ...p, distance: calculateDistance(userLocation.lat, userLocation.lng, p.lat, p.lng) };
                    }
                    return { ...p, distance: 9999 };
                });
                result.sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));
            }

            grid.innerHTML = '';

            if (result.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">
                    <i class="fa-solid fa-box-open text-4xl mb-3 opacity-50"></i>
                    <p>Không tìm thấy quán nào phù hợp với bộ lọc hiện tại.</p>
                </div>`;
                return;
            }

            // Logic Phân Trang
            const totalItems = result.length;
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);

            if (currentPage > totalPages && totalPages > 0) {
                currentPage = totalPages;
            }

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const paginatedResult = result.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            paginatedResult.forEach(place => {
                let distanceHTML = '';
                if (place.distance && place.distance < 9999) {
                    distanceHTML = `<div class="flex items-center gap-1.5 text-green-600 text-sm font-medium mt-1.5">
                        <img src="pictures/hinh3.jpg" class="w-6 h-6 object-contain inline-block mr-0.5" style="filter: url(#remove-white);" alt="Distance">
                        <span>Cách bạn khoảng ${place.distance} km</span>
                    </div>`;
                }

                // Cấu hình Link chỉ đường luôn luôn dẫn tới Địa chỉ chữ cụ thể của quán ăn (Chỉ lấy duy nhất địa chỉ cụ thể)
                let mapUrl = '';
                let originParam = 'My+Location';
                if (userLocation && userLocation.lat && userLocation.lng) {
                    // Nếu đã định vị chính xác trên web, truyền thẳng tọa độ GPS thực của bạn sang Google Maps để tránh sai lệch điểm đi
                    originParam = `${userLocation.lat},${userLocation.lng}`;
                }
                mapUrl = `https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${encodeURIComponent(place.address)}`;

                // Vẽ sao để click đánh giá trực tiếp - đổi từ sao vàng sang sao cam sữa
                let starsHTML = '';
                const currentRating = Math.round(place.rating || 5);
                for (let i = 1; i <= 5; i++) {
                    const isFilled = i <= currentRating;
                    starsHTML += `<i onclick="updateRating('${place.id}', ${i})" class="cursor-pointer text-lg p-0.5 fa-star ${isFilled ? 'fa-solid text-orange-400' : 'fa-regular text-gray-300 hover:text-orange-300'}"></i>`;
                }

                // Icon Yêu thích (Trái tim đỏ FontAwesome - So sánh chuỗi an toàn)
                const isFav = favoriteIds.includes(String(place.id));

                const card = `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col justify-between hover:shadow-md transition-all relative overflow-hidden group">
                        
                        <!-- Hàng trên cùng: Tên quán bên trái, Trái tim dịch ra góc ngoài cùng bên phải (Badge phân loại ẩn) -->
                        <div class="flex items-start justify-between gap-3">
                            <h3 onclick="openEditModal('${place.id}')" class="font-bold text-xl text-gray-800 leading-snug cursor-pointer hover:text-orange-600 transition duration-150 flex-1" title="Bấm để chỉnh sửa thông tin quán">
                                ${place.name}
                            </h3>
                            <button onclick="toggleFavorite('${place.id}')" class="transition flex items-center justify-center flex-shrink-0 bg-transparent text-2xl" style="margin-top: -2px;" title="Yêu thích">
                                <i class="fa-heart transition duration-200 ${isFav ? 'fa-solid text-red-500 scale-110' : 'fa-regular text-gray-300 hover:text-red-400'}"></i>
                            </button>
                            <!-- Badge phân loại ẩn đi theo yêu cầu, vẫn có dữ liệu để tìm kiếm/lọc -->
                            <span class="hidden">${place.category}</span>
                        </div>
                        
                        <div class="mt-1">
                            <!-- Khung đánh giá sao click trực tiếp -->
                            <div class="flex items-center gap-1 mb-2">
                                ${starsHTML}
                                <span class="text-xs text-gray-500 ml-1">(${place.rating || 5})</span>
                            </div>

                            <!-- Icon map (google_pin.png) - Ghim vị trí Google Maps sắc nét và căn giữa -->
                            <div class="flex items-center gap-2 text-gray-600 text-sm">
                                <img src="pictures/google_pin.png" class="w-5 h-5 object-contain flex-shrink-0" alt="Map">
                                <span class="leading-none">${place.address}</span>
                            </div>

                            <!-- Dòng Quận có icon mèo đáng yêu (placeholder.png) -->
                            <div class="flex items-center gap-2 text-gray-600 text-sm mt-1.5">
                                <img src="pictures/placeholder.png" class="w-5 h-5 object-contain flex-shrink-0" style="filter: url(#remove-white);" alt="Quận">
                                <span class="leading-none">${place.district}</span>
                            </div>

                            <!-- Dòng Giờ mở cửa (Nếu có) -->
                            ${place.opening_hours ? `
                            <div class="flex items-center gap-2 text-gray-600 text-sm mt-1.5">
                                <i class="fa-regular fa-clock text-gray-400 text-base flex-shrink-0 w-5 text-center"></i>
                                <span class="leading-none">${place.opening_hours}</span>
                            </div>
                            ` : ''}
                            ${distanceHTML}
                            ${place.review ? `
                                <div class="mt-3 bg-gray-50 border-l-2 border-orange-300 p-2 text-sm text-gray-500 italic rounded-r">
                                    "${place.review}"
                                </div>
                            ` : ''}
                        </div>
                        <div class="mt-5">
                            <!-- Nút chỉ đường dùng hinh3.jpg (Kéo dài toàn bộ chiều ngang card) -->
                            <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" 
                                class="w-full bg-orange-50 hover:bg-orange-100 text-orange-700 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition duration-200 text-center">
                                <img src="pictures/hinh3.jpg" class="w-6 h-6 object-contain inline-block mr-1" style="filter: url(#remove-white);"> Chỉ đường
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });

            // Vẽ các nút phân trang nếu có nhiều hơn 1 trang
            if (totalPages > 1) {
                // Khối 1: Rút gọn tối đa cho MOBILE (Không bao giờ tràn)
                let mobilePaginationHTML = `
                    <div class="col-span-full flex sm:hidden justify-between items-center gap-4 mt-8 mb-4 px-4 w-full bg-white bg-opacity-70 backdrop-blur-md rounded-2xl py-3 border border-gray-100 shadow-sm">
                        <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} 
                            class="w-10 h-10 rounded-full bg-orange-50 hover:bg-orange-100 text-orange-600 disabled:opacity-30 disabled:cursor-not-allowed disabled:bg-gray-50 disabled:text-gray-400 transition duration-200 flex items-center justify-center flex-shrink-0 shadow-sm border border-orange-100">
                            <i class="fa-solid fa-chevron-left text-sm"></i>
                        </button>
                        
                        <div id="pageSwipeContainer" 
                            ontouchstart="handleSwipeStart(event)" 
                            ontouchmove="handleSwipeMove(event)" 
                            ontouchend="handleSwipeEnd(event)" 
                            class="flex-1 flex flex-col items-center gap-1.5 px-2 cursor-grab active:cursor-grabbing select-none transition-all duration-150">
                            <!-- Nút chọn số trang dạng Dropdown Pill tinh tế -->
                            <div class="relative flex items-center justify-center bg-orange-50 bg-opacity-80 px-3 py-1 rounded-full border border-orange-100 shadow-sm cursor-pointer hover:bg-orange-100 transition duration-200">
                                <select onchange="changePage(parseInt(this.value))" 
                                    class="bg-transparent text-xs font-extrabold tracking-wider text-orange-600 uppercase focus:outline-none cursor-pointer appearance-none text-center pr-3.5 leading-none">
                                    ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `
                                        <option value="${p}" ${p === currentPage ? 'selected' : ''}>Trang ${p} / ${totalPages}</option>
                                    `).join('')}
                                </select>
                                <i class="fa-solid fa-chevron-down text-[9px] text-orange-500 pointer-events-none absolute right-2.5"></i>
                            </div>
                            <div class="w-full h-1.5 bg-orange-100 rounded-full overflow-hidden relative">
                                <div class="h-full bg-gradient-to-r from-orange-400 to-orange-500 rounded-full transition-all duration-300" style="width: ${(currentPage / totalPages) * 100}%"></div>
                            </div>
                        </div>
                        
                        <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} 
                            class="w-10 h-10 rounded-full bg-orange-50 hover:bg-orange-100 text-orange-600 disabled:opacity-30 disabled:cursor-not-allowed disabled:bg-gray-50 disabled:text-gray-400 transition duration-200 flex items-center justify-center flex-shrink-0 shadow-sm border border-orange-100">
                            <i class="fa-solid fa-chevron-right text-sm"></i>
                        </button>
                    </div>
                `;

                // Khối 2: Phân trang thông minh cho DESKTOP (Có dấu ba chấm rút gọn)
                let desktopPaginationHTML = `
                    <div class="col-span-full hidden sm:flex justify-center items-center gap-2 mt-8 mb-4">
                        <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} 
                            class="px-3.5 py-2 rounded-lg bg-orange-100 text-orange-700 hover:bg-orange-200 disabled:opacity-40 disabled:cursor-not-allowed transition duration-200 text-sm font-semibold flex items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-chevron-left text-xs"></i> Trước
                        </button>
                `;

                // Thuật toán rút gọn dấu ba chấm (Ellipsis Pager)
                const range = [];
                const delta = 2; // Số trang lân cận muốn hiển thị trên desktop
                const left = currentPage - delta;
                const right = currentPage + delta + 1;
                let l;

                for (let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || (i >= left && i < right)) {
                        range.push(i);
                    }
                }

                for (let i of range) {
                    if (l) {
                        if (i - l === 2) {
                            desktopPaginationHTML += `<span class="px-2 text-gray-400 font-semibold select-none">...</span>`;
                        } else if (i - l > 2) {
                            desktopPaginationHTML += `<span class="px-2 text-gray-400 font-semibold select-none">...</span>`;
                        }
                    }
                    const isActive = i === currentPage;
                    desktopPaginationHTML += `
                        <button onclick="changePage(${i})" 
                            class="w-9 h-9 rounded-lg transition duration-200 text-sm font-bold shadow-sm ${isActive ? 'bg-orange-500 text-white' : 'bg-orange-100 text-orange-700 hover:bg-orange-200'}">
                            ${i}
                        </button>
                    `;
                    l = i;
                }

                desktopPaginationHTML += `
                        <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} 
                            class="px-3.5 py-2 rounded-lg bg-orange-100 text-orange-700 hover:bg-orange-200 disabled:opacity-40 disabled:cursor-not-allowed transition duration-200 text-sm font-semibold flex items-center gap-1 shadow-sm">
                            Sau <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>
                `;

                grid.innerHTML += mobilePaginationHTML + desktopPaginationHTML;
            }
        }

        // Xử lý cơ chế kéo để reload (Pull-to-refresh) cho Mobile Standalone
        let touchStart = 0;
        let touchDecel = 0;
        const ptrIndicator = document.getElementById('pullToRefreshIndicator');
        const ptrText = document.getElementById('pullToRefreshText');

        window.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0) {
                touchStart = e.touches[0].clientY;
            } else {
                touchStart = 0;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (touchStart === 0) return;
            const currentY = e.touches[0].clientY;
            const distance = currentY - touchStart;

            if (distance > 0 && distance < 180) {
                ptrIndicator.style.height = `${distance}px`;
                ptrIndicator.style.paddingTop = '0.75rem';
                ptrIndicator.style.paddingBottom = '0.75rem';
                ptrIndicator.style.borderBottomWidth = '1px';
                ptrIndicator.style.opacity = `${distance / 180}`;
                if (distance > 100) {
                    ptrText.innerText = "Thả tay để làm mới dữ liệu...";
                } else {
                    ptrText.innerText = "Kéo để làm mới...";
                }
            }
        });

        window.addEventListener('touchend', async (e) => {
            if (touchStart === 0) return;
            const currentY = e.changedTouches[0].clientY;
            const distance = currentY - touchStart;

            if (distance > 100) {
                ptrText.innerText = "Đang cập nhật từ Supabase...";
                ptrIndicator.style.height = '50px';
                ptrIndicator.style.paddingTop = '0.75rem';
                ptrIndicator.style.paddingBottom = '0.75rem';
                ptrIndicator.style.borderBottomWidth = '1px';
                await loadPlaces();
            }
            
            // Đóng indicator sau khi load xong hoặc hủy kéo
            setTimeout(() => {
                ptrIndicator.style.height = '0px';
                ptrIndicator.style.paddingTop = '0px';
                ptrIndicator.style.paddingBottom = '0px';
                ptrIndicator.style.borderBottomWidth = '0px';
                ptrIndicator.style.opacity = '0';
            }, 600);
            
            touchStart = 0;
        });

        // Khởi chạy khi tải trang
        loadPlaces();

    </script>
</body>
</html>
